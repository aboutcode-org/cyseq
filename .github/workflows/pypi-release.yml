name: Create library release archives, create a GH release and publish PyPI wheel and sdist on tag in main branch


# This is executed automatically on a tag in the main branch

# Summary of the steps:
# - build wheels and sdist
# - upload wheels and sdist to PyPI
# - create gh-release and upload wheels and dists there
# TODO: smoke test wheels and sdist
# TODO: add changelog to release text body

# WARNING: this is designed only for packages building as pure Python wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions: {}
jobs:
  build-wheels:
      name: Build unicode wheels ${{ matrix.type }} ${{ matrix.arch }} on ${{ matrix.os }}
      runs-on: ${{ matrix.os }}
      defaults:
        run:
          shell: bash
      strategy:
          fail-fast: false
          matrix:
              os: [macos-latest, windows-latest]
              arch: [auto64]
              build: ["cp{310,311,312,313,314,315}-*"]

              include:
                  - os: ubuntu-latest
                    arch: auto64
                    type: manylinux2014
                    build: "cp{310,311,312,313,314,315}-*"
                    CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014

                  - os: ubuntu-24.04-arm
                    arch: aarch64
                    build: "cp{310,311,312,313,314,315}-*"
                    CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014

                  - os: macos-latest
                    arch: universal2
                    build: "cp{310,311,312,313,314,315}-*"

                  - os: windows-latest
                    arch: auto64
                    build: "cp{310,311,312,313,314,315}-*"

      steps:
          - name: Checkout repository
            # https://github.com/actions/checkout/releases/tag/v7.0.1  
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              persist-credentials: false

          - name: Build wheels and run tests
            # https://github.com/pypa/cibuildwheel/releases/tag/v4.3.5
            uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
            env:
                CIBW_BUILD: ${{ matrix.build }}
                CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.CIBW_MANYLINUX_X86_64_IMAGE }}
                CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.CIBW_MANYLINUX_AARCH64_IMAGE }}
                CIBW_ARCHS: ${{ matrix.arch }}
                CIBW_TEST_REQUIRES: pytest
                CIBW_TEST_COMMAND: pytest -vvs {project}/tests

          - name: Collect built wheels
            # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
            uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
            with:
                name: cyseq-wheels-${{ matrix.os }}-${{ strategy.job-index }}
                path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-24.04

    steps:
        - name: Checkout repository
          # https://github.com/actions/checkout/releases/tag/v7.0.1  
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - name: Checkout and install reqs
          run: |
              pip install --upgrade --user build twine pkginfo packaging pip setuptools cython
              pip install setuptools-scm==10.0.4

        - name: Build sdist
          run: |
              python setup.py sdist
              twine check dist/*

        - name: Collect built sdist
          # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
          uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
          with:
              name: cyseq-sdist
              path: dist/*.tar.gz

  merge:
    runs-on: ubuntu-latest
    needs: [build-sdist, build-wheels]
    steps:
      - name: Merge created wheels and sdist in a single zip
        # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyseq-build
          pattern: cyseq-*

  check-dist:
    name: Check distributions are PyPi-correct
    needs: merge
    runs-on: ubuntu-22.04
    steps:
      - name: Download wheels artifact
        # https://github.com/actions/download-artifact/releases/tag/v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: cyseq-build
      - run: find . -ls
      - run: pipx run twine check --strict cyseq-build/*/*

  create-gh-release:
    name: Create GH release
    needs:
      - check-dist
    runs-on: ubuntu-24.04
    permissions:
      contents: write 

    steps:
      - name: Download builds
        # https://github.com/actions/download-artifact/releases/tag/v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cyseq-build
          path: cyseq-build

      - name: Create GH release
        # https://github.com/softprops/action-gh-release/releases/tag/v3.0.4
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          files: cyseq-build/*

  create-pypi-release:
    name: Create PyPI release
    needs:
      - create-gh-release
    runs-on: ubuntu-24.04
    environment: pypi-publish
    permissions:
      id-token: write

    steps:
      - name: Download builds
        # https://github.com/actions/download-artifact/releases/tag/v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cyseq-build
          path: dist/

      - name: Mock PyPI upload
        run: |
          ls -al dist

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags')
        # https://github.com/pypa/gh-action-pypi-publish/releases/tag/v1.14.3
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 #v1.14.3
