name: Run tests and build wheel and sdist on all supported OS and Python

on: [push, pull_request, workflow_dispatch]

permissions: {}
jobs:
    build_wheels:
        name: Build unicode wheels ${{ matrix.type }} ${{ matrix.arch }} on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        defaults:
          run:
            shell: bash
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]
                arch: [auto64]
                build: ["cp{310,311,312,313,314,315}-*"]

                include:
                    - os: ubuntu-latest
                      arch: auto64
                      type: manylinux2014
                      build: "cp{310,311,312,313,314,315}-*"
                      CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014

                    - os: ubuntu-24.04-arm
                      arch: aarch64
                      build: "cp{310,311,312,313,314,315}-*"
                      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014

                    - os: macos-latest
                      arch: universal2
                      build: "cp{310,311,312,313,314,315}-*"

                    - os: windows-latest
                      arch: auto64
                      build: "cp{310,311,312,313,314,315}-*"

        steps:
            - name: Checkout repository
              # https://github.com/actions/checkout/releases/tag/v7.0.1  
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Build wheels and run tests
              # https://github.com/pypa/cibuildwheel/releases/tag/v4.3.5
              uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
              env:
                  CIBW_BUILD: ${{ matrix.build }}
                  CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.CIBW_MANYLINUX_X86_64_IMAGE }}
                  CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.CIBW_MANYLINUX_AARCH64_IMAGE }}
                  CIBW_ARCHS: ${{ matrix.arch }}
                  CIBW_TEST_REQUIRES: pytest
                  CIBW_TEST_COMMAND: pytest -vvs {project}/tests

            - name: Collect built wheels
              # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
                  path: ./wheelhouse/*.whl

    build_sdist:
      name: Build source distribution
      runs-on: ubuntu-24.04

      steps:
          - name: Checkout repository
            # https://github.com/actions/checkout/releases/tag/v7.0.1  
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              persist-credentials: false

          - name: Checkout and install reqs
            run: |
                pip install --upgrade --user build twine pkginfo packaging pip setuptools cython
                pip install setuptools-scm==10.0.4

          - name: Build sdist
            run: |
                python setup.py sdist
                twine check dist/*

          - name: Collect built sdist
            # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
            uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
            with:
                path: dist/*.tar.gz

    test_on_posix_oses:
        name: Run tests ${{ matrix.python }} on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        defaults:
          run:
            shell: bash

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-26]
                python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

        steps:
            - name: Set up Python
              # https://github.com/actions/setup-python/releases/tag/v7.1.0
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                python-version: "${{ matrix.python }}"

            - name: Checkout repository
              # https://github.com/actions/checkout/releases/tag/v7.0.1  
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Build, install and test
              run: >
                  make dev &&
                  make test

    test_on_nt_oses:
        name: Run tests ${{ matrix.python }} on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest]
                python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

        steps:
            - name: Set up Python
              # https://github.com/actions/setup-python/releases/tag/v7.1.0
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                python-version: "${{ matrix.python }}"

            - name: Checkout repository
              # https://github.com/actions/checkout/releases/tag/v7.0.1  
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Build, install and test
              run: >
                  .\configure.bat --dev &&
                  .\venv\Scripts\activate &&
                  py.test -vvs .
